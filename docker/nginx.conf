# Replaces nginx's default site so browsers always get the current version of Retrocast.
# "no-cache" doesn't stop caching: browsers keep their copy but check with the server on every
# load, and unchanged files come back as a short "not modified" reply. Without it, browsers
# guess how long to reuse files, which could hold an old version for hours after an update.
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
